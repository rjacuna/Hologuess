[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hologuess"
version = "0.3.0"
description = "Modular guessing of relations in observable Ore modules"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "threadpoolctl>=3"]

[tool.setuptools]
packages = ["hologuess"]

[tool.setuptools.package-data]
hologuess = ["_flint_bridge.c"]
